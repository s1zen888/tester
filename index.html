<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Викторина</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--ac:#9aa8b5;--tech:#8fb5d8;--tx:#ebe7df;--mut:rgba(235,231,223,.55);--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.09)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;font-family:Manrope,system-ui,sans-serif;color:var(--tx);background:#171b21;position:relative;overflow-x:hidden}
/* Фон: мягкий градиент + тематический знак. Своё фото: добавь в body background-image:url(...) */
body::before{content:attr(data-ic);position:fixed;right:-30px;bottom:-40px;font-size:300px;opacity:.05;pointer-events:none;line-height:1}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 0% 0%,rgba(255,255,255,.05),transparent),linear-gradient(170deg,#1b2027,#14171c)}
#app{max-width:480px;margin:auto;padding:22px 16px 96px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1,h2{font-family:"Playfair Display",Georgia,serif;font-weight:600}
h1{font-size:30px;margin:6px 0 2px}h2{font-size:24px}
.sub{color:var(--mut);margin:0 0 20px;font-size:14px}
.tabs{display:flex;gap:8px;margin:0 0 18px}
.tab{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--mut);font:600 15px Manrope;cursor:pointer}
.tab.on{background:var(--card);color:var(--tx);border-color:rgba(255,255,255,.22)}
.card{display:flex;align-items:center;gap:14px;width:100%;padding:16px;margin-bottom:10px;border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:16px;background:var(--card);color:inherit;font:inherit;text-align:left;cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.98)}.card[disabled]{opacity:.4}
.ic{font-size:28px}.card b{display:block;font-size:17px}.card small{color:var(--mut);font-size:13px}
.pb{height:4px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}
.d-easy{--ac:#8fb59b}.d-medium{--ac:#d8b678}.d-hard{--ac:#c98895}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.back{background:none;border:0;color:var(--tx);font-size:22px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lv{padding:16px 10px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:inherit;font:inherit;cursor:pointer;text-align:center}
.lv b{display:block;font-size:20px;color:var(--ac)}.lv small{color:var(--mut)}.lv.done{border-color:var(--ac)}
.q{font-family:"Playfair Display",Georgia,serif;font-size:22px;line-height:1.35;margin:4px 0 22px;min-height:90px}
.opt{display:block;width:100%;padding:15px;margin-bottom:10px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:inherit;font:600 16px Manrope;text-align:left;cursor:pointer;transition:background .25s}
.opt.ok{background:rgba(143,181,155,.35);border-color:#8fb59b}.opt.bad{background:rgba(201,136,149,.35);border-color:#c98895}
.cnt{color:var(--mut);font-size:14px}.bar{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}
.res{text-align:center;padding-top:24px}.big{font-size:64px}.score{font:600 46px "Playfair Display",serif;margin:6px 0;color:var(--ac)}
.btn{display:block;width:100%;padding:14px;margin-bottom:10px;border-radius:14px;border:1px solid var(--ac);background:var(--ac);color:#15181d;font:700 16px Manrope;cursor:pointer;text-decoration:none;text-align:center}.btn.alt{background:none;color:var(--tx);border-color:var(--line)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.stat div{padding:14px 6px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center}.stat b{display:block;font:600 24px "Playfair Display",serif}.stat small{color:var(--mut);font-size:12px}

/* Технический раздел */
.tech-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:rgba(143,181,216,.12);border:1px solid rgba(143,181,216,.28);color:var(--tech);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.tech-box{padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--tech);margin-bottom:14px}
.tech-msg{font-size:15px;line-height:1.58;color:var(--tx)}
.tech-handle{color:var(--tech);font-weight:700;text-decoration:none;border-bottom:1px dashed rgba(143,181,216,.5);padding-bottom:1px}
.tech-actions{display:flex;gap:8px;margin-top:14px}
.tech-actions .btn{margin-bottom:0;padding:11px 12px;font-size:14px;border-radius:12px}
.tech-actions .btn.primary-tech{background:var(--tech);border-color:var(--tech);color:#12161c}
.qr-card{padding:20px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:center}
.qr-title{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:4px}
.qr-sub{font-size:12px;color:var(--mut);margin-bottom:14px}
.qr-img{display:block;width:min(268px,100%);height:auto;aspect-ratio:1/1;margin:0 auto;object-fit:contain;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.35)}

.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(20,23,28,.88);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.nav button{flex:1;max-width:160px;padding:10px 6px;border-radius:12px;border:0;background:none;color:var(--mut);font:600 13px Manrope;cursor:pointer;white-space:nowrap}.nav button.on{background:var(--card);color:var(--tx)}
</style></head><body><div id="app"></div>
<div class="nav">
  <button id="n1" onclick="home()">🏠 Главная</button>
  <button id="n2" onclick="profile()">👤 Профиль</button>
  <button id="n3" onclick="tech()">🛠️ Тех. раздел</button>
</div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const Q={9:{},10:{},11:{}}; // сюда подгружаются файлы q9_history.js и т.д.
</script>
<script src="q9_history.js"></script><script src="q9_chemistry.js"></script><script src="q9_biology.js"></script>
<script src="q10_history.js"></script><script src="q10_chemistry.js"></script><script src="q10_biology.js"></script>
<script src="q11_history.js"></script><script src="q11_chemistry.js"></script><script src="q11_biology.js"></script>
<script>
const C={history:["📜","История"],chemistry:["⚗️","Химия"],biology:["🧬","Биология"]};
const Df={easy:["Лёгкая","🌱"],medium:["Средняя","🔥"],hard:["Сложная","💎"]};
const $=document.getElementById("app");let g=9,st={};
let P={l:{},a:0,c:0};try{P=JSON.parse(localStorage.getItem("qp"))||P}catch(e){}
const save=()=>{try{localStorage.setItem("qp",JSON.stringify(P))}catch(e){}};
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const hap=t=>{try{tg.HapticFeedback.notificationOccurred(t)}catch(e){}};
const pool=(G,c,d)=>((Q[G]||{})[c]||{})[d]||[];
const nl=(G,c,d)=>Math.floor(pool(G,c,d).length/10);
const bs=(G,c,d,i)=>P.l[[G,c,d,i].join("-")];
const passed=(G,c,d)=>{let n=0;for(let i=0;i<nl(G,c,d);i++)if((bs(G,c,d,i)||0)>=6)n++;return n};
const tot=(G,c)=>Object.keys(Df).reduce((s,d)=>s+nl(G,c,d),0);
const don=(G,c)=>Object.keys(Df).reduce((s,d)=>s+passed(G,c,d),0);
const setNav=nav=>{[n1,n2,n3].forEach((b,idx)=>b.className=nav===idx+1?"on":"")};
const put=(h,ic,nav)=>{document.body.dataset.ic=ic||"";setNav(nav);$.style.animation="none";$.offsetHeight;$.style.animation="";$.innerHTML=h;scrollTo(0,0)};

function openSupport(e){
  if(e)e.preventDefault();
  hap("success");
  const url="https://t.me/ss1zenxxx";
  if(tg&&tg.openTelegramLink){tg.openTelegramLink(url)}
  else{window.open(url,"_blank","noopener")}
}

function copyHandle(btn){
  const text="@ss1zenxxx";
  const done=()=>{
    hap("success");
    const prev=btn.textContent;
    btn.textContent="✓ Скопировано";
    setTimeout(()=>{btn.textContent=prev},1500);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>{
      const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();done();
    });
  }else{
    const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();done();
  }
}

function home(){
 put(`<h1>Викторина</h1><p class="sub">Выбери класс и предмет</p><div class="tabs">${[9,10,11].map(x=>`<button class="tab ${x==g?"on":""}" onclick="g=${x};home()">${x} класс</button>`).join("")}</div>`+
 Object.keys(C).map(c=>{const t=tot(g,c),d=don(g,c);return `<button class="card" ${t?"":"disabled"} onclick="diffs('${c}')"><span class="ic">${C[c][0]}</span><span style="flex:1"><b>${C[c][1]}</b><small>${t?`Пройдено уровней: ${d} из ${t}`:"Скоро"}</small><div class="pb"><i style="width:${t?d/t*100:0}%"></i></div></span></button>`}).join(""),"",1)}
function diffs(c){
 put(`<div class="top"><button class="back" onclick="home()">←</button><h2>${C[c][1]} · ${g} класс</h2></div><p class="sub">Выбери сложность</p>`+
 Object.keys(Df).map(d=>{const t=nl(g,c,d),p=passed(g,c,d);return `<button class="card d-${d}" ${t?"":"disabled"} onclick="levels('${c}','${d}')"><span class="ic">${Df[d][1]}</span><span style="flex:1"><b>${Df[d][0]}</b><small>${t?`${p} из ${t} уровней пройдено`:"Скоро"}</small><div class="pb"><i style="width:${t?p/t*100:0}%"></i></div></span></button>`}).join(""),C[c][0],1)}
function levels(c,d){
 let h="";for(let i=0;i<nl(g,c,d);i++){const b=bs(g,c,d,i);h+=`<button class="lv ${b>=6?"done":""}" onclick="play('${c}','${d}',${i})"><b>Уровень ${i+1}</b><small>${b==null?"не пройден":(b>=6?"✓ ":"")+"лучший: "+b+"/10"}</small></button>`}
 put(`<div class="top d-${d}"><button class="back" onclick="diffs('${c}')">←</button><h2>${Df[d][1]} ${Df[d][0]}</h2></div><p class="sub">Каждый уровень — 10 новых вопросов. Зачёт от 6 из 10</p><div class="grid d-${d}">${h}</div>`,C[c][0],1)}
function play(c,d,i){
 const qs=sh(pool(g,c,d).slice(i*10,i*10+10)).map(s=>{const [q,k,...w]=s.split("|");return{q,k,o:sh([k,...w])}});
 st={c,d,i,qs,n:0,s:0,lock:0};show()}
function show(){
 const q=st.qs[st.n];
 put(`<div class="top d-${st.d}"><button class="back" onclick="levels('${st.c}','${st.d}')">✕</button><div class="bar"><i style="width:${st.n*10}%"></i></div><span class="cnt">${st.n+1}/10</span></div><div class="q">${q.q}</div>`+q.o.map((o,k)=>`<button class="opt" onclick="ans(this,${k})">${o}</button>`).join(""),C[st.c][0],1)}
function ans(b,k){
 if(st.lock)return;st.lock=1;const q=st.qs[st.n],ok=q.o[k]===q.k;
 document.querySelectorAll(".opt").forEach(e=>{if(e.textContent===q.k)e.classList.add("ok")});
 P.a++;if(ok){st.s++;P.c++;hap("success")}else{b.classList.add("bad");hap("error")}
 setTimeout(()=>{st.lock=0;st.n++;st.n<10?show():result()},1050)}
function result(){
 const key=[g,st.c,st.d,st.i].join("-");if(P.l[key]==null||P.l[key]<st.s)P.l[key]=st.s;save();
 const ok=st.s>=6,last=st.i+1>=nl(g,st.c,st.d);
 put(`<div class="res d-${st.d}"><div class="big">${st.s>=9?"🏆":ok?"✨":"📖"}</div><div class="score">${st.s} / 10</div><p class="sub">${ok?"Уровень пройден!":"Для зачёта нужно минимум 6. Попробуй ещё!"}</p>
 ${ok&&!last?`<button class="btn" onclick="play('${st.c}','${st.d}',${st.i+1})">Следующий уровень →</button>`:""}
 <button class="btn ${ok&&!last?"alt":""}" onclick="play('${st.c}','${st.d}',${st.i})">Ещё раз</button>
 <button class="btn alt" onclick="levels('${st.c}','${st.d}')">К уровням</button></div>`,C[st.c][0],1)}
function profile(){
 const acc=P.a?Math.round(P.c/P.a*100):0;let T=0,D=0;
 const rows=[9,10,11].map(G=>Object.keys(C).map(c=>{const t=tot(G,c),d=don(G,c);T+=t;D+=d;return t?`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${C[c][0]} ${C[c][1]} · ${G} кл.</span><span class="cnt">${d}/${t}</span></div><div class="pb"><i style="width:${d/t*100}%;background:#9aa8b5"></i></div></div>`:""}).join("")).join("");
 put(`<h1>Профиль</h1><p class="sub">Твой прогресс</p><div class="stat"><div><b>${acc}%</b><small>верных ответов</small></div><div><b>${P.a}</b><small>вопросов</small></div><div><b>${D}/${T}</b><small>уровней</small></div></div>
 <h2 style="font-size:19px;margin-bottom:12px">По предметам</h2>${rows||'<p class="sub">Пока нет доступных уровней</p>'}
 <button class="btn alt" style="margin-top:14px" onclick="if(confirm('Сбросить весь прогресс?')){P={l:{},a:0,c:0};save();profile()}">Сбросить прогресс</button>`,"👤",2)}

function tech(){
 put(`
  <div class="tech-badge">● System · Support</div>
  <h1>Технический раздел</h1>
  <p class="sub">Диагностика, баг-репорты и обратная связь</p>

  <div class="tech-box">
    <p class="tech-msg">Вы попали в тех.раздел. Если вы нашли ошибки в боте или у вас есть какие-то предложения, то обращайтесь к <a class="tech-handle" href="https://t.me/ss1zenxxx" onclick="openSupport(event)">@ss1zenxxx</a></p>
    <div class="tech-actions">
      <button class="btn primary-tech" onclick="openSupport(event)">Написать @ss1zenxxx</button>
      <button class="btn alt" onclick="copyHandle(this)">Копировать ник</button>
    </div>
  </div>

  <div class="qr-card">
    <div class="qr-title">Быстрый переход через QR-код</div>
    <div class="qr-sub">Наведите камеру или сканер Telegram</div>
    <img class="qr-img" src="qr.png" data-fallbacks='["qr.jpg","qr.jpeg","qr.webp","assets/qr.png","img/qr.png"]' onerror="const fb=JSON.parse(this.dataset.fallbacks||'[]');const i=Number(this.dataset.i||0);if(i<fb.length){this.dataset.i=i+1;this.src=fb[i]}else{this.style.display='none'}" alt="QR-код @SS1ZENXXX">
  </div>
 `,"🛠️",3)}
home();
</script></body></html>
